name: Android APK

on:
  push:
    paths: ['index.html', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      # Fingerprint of the Android part (not the web page). The app only offers an APK update when
      # the newest release's fingerprint differs from its own; web-only changes come in through WebUpdater.
      - name: Fingerprint the Android part
        run: echo "NATIVE_HASH=$(git ls-files -s android | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../prevodilac.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prevodilac-apk
          path: prevodilac.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/prevodilac.apk
      # The tag must match the app's versionCode (run number + BUILD_OFFSET, see android/app/build.gradle):
      # the in-app update check compares the number after the last dot with the installed version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OFFSET: 0
        run: |
          BUILD=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          gh release create "v1.0.$BUILD" prevodilac.apk \
            --title "Преводилац 1.0.$BUILD" \
            --notes "Android build of commit ${{ github.sha }}. Download prevodilac.apk below and open it on your phone to install or update. native: ${{ env.NATIVE_HASH }}"
