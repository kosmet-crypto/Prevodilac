plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'manifest.json', 'icons/**'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'app.prevodilac'
    compileSdk 35

    defaultConfig {
        applicationId 'app.prevodilac'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes the run number so each new APK installs over the previous one.
        // Keep the offset in sync with BUILD_OFFSET in .github/workflows/android.yml.
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        def build = runNumber ? (runNumber as int) + 0 : 1
        versionCode build
        versionName "1.0.${build}"
        // Fingerprint of android/ from CI; a newer release with the same one only has web changes.
        buildConfigField 'String', 'NATIVE_HASH', "\"${System.getenv('NATIVE_HASH') ?: ''}\""
        // Where the app looks for newer APKs (GitHub Releases of this repo) and page updates (main).
        buildConfigField 'String', 'UPDATE_REPO', "\"${System.getenv('GITHUB_REPOSITORY') ?: 'kosmet-crypto/Prevodilac'}\""
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('prevodilac.keystore')
            storePassword 'prevodilac'
            keyAlias 'prevodilac'
            keyPassword 'prevodilac'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
